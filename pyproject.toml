[project]
name = "finance-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "greenlet>=3.5.6",
    "joblib>=1.6.0",
    "ofxparse>=0.21",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "streamlit>=1.67.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]
[project.scripts]
finance-hub = "finance_hub:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
